<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ugens madplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: en telefon-app med to faner. Prisskilte i gult er sidens eneste farveaccent, som på butikshylden. */
:root{
  --bg:#E9EEF0; --surface:#FFFFFF; --ink:#15212B; --muted:#5A6873; --line:#CFD8DD;
  --tag:#F6C60F; --tag-ink:#14181D;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12181F; --surface:#1B232C; --ink:#E8EEF2; --muted:#9AA8B3; --line:#2F3A45;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12181F; --surface:#1B232C; --ink:#E8EEF2; --muted:#9AA8B3; --line:#2F3A45;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.05;text-wrap:balance}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
#view-list{overflow-y:auto;-webkit-overflow-scrolling:touch}

nav{flex:none;display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);background:var(--surface)}
nav button{padding:14px 8px 15px;text-align:center;font:700 21px/1 var(--display);letter-spacing:.02em;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tag)}

/* Indkøb */
.head{padding:18px 16px 14px;display:flex;flex-direction:column;gap:10px}
.head-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.head h1{font-size:44px}
.total{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:15px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 16px 6px}
.days button{padding:9px 0;text-align:center;font:600 19px/1 var(--display);border:1.5px solid var(--ink);border-radius:6px;background:var(--ink);color:var(--bg)}
.days button[aria-pressed="false"]{background:transparent;color:var(--muted);border-color:var(--line);text-decoration:line-through}
.hint{padding:0 16px 10px;color:var(--muted);font-size:14px;margin:0}
.hint b{color:var(--ink);font-weight:600}
.group{padding:12px 16px 2px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.group h2{font-size:25px}
.group span{color:var(--muted);font:500 14px var(--mono)}
.rows{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;width:100%;min-height:60px;padding:9px 16px}
.row + .row{border-top:1px solid var(--line)}
.box{width:26px;height:26px;border:2px solid var(--ink);border-radius:5px;display:grid;place-items:center}
.box svg{width:16px;height:16px;opacity:0}
[aria-checked="true"] .box{background:var(--ink)}
[aria-checked="true"] .box svg{opacity:1;stroke:var(--bg)}
.name{font-weight:600;line-height:1.25}
.meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:2px}
.meta b{font-weight:500;color:var(--ink);border-bottom:1.5px solid var(--tag)}
.price{font:500 16px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.price.deal{background:var(--tag);color:var(--tag-ink);font:700 22px/1 var(--display);padding:5px 8px 4px;border-radius:3px}
[aria-checked="true"] .name{text-decoration:line-through;color:var(--muted)}
[aria-checked="true"] .price{opacity:.45}
.tools{padding:18px 16px 8px;display:flex;flex-direction:column;gap:10px}
.btn{display:block;width:100%;text-align:center;padding:14px;border:1.5px solid var(--ink);border-radius:6px;font-weight:600}
.btn.quiet{border-color:var(--line);color:var(--muted);font-weight:500}
#copy-out{width:100%;height:150px;font:15px/1.4 var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;display:none}
.foot{padding:4px 16px 140px;color:var(--muted);font-size:13px;margin:0}

/* Opskrifter */
#view-rec.on{display:flex;flex-direction:column}
.dayjump{display:grid;grid-template-columns:repeat(5,1fr);padding:8px 10px 0;gap:2px;border-bottom:1px solid var(--line)}
.dayjump button{text-align:center;padding:6px 0 9px;font:700 22px/1 var(--display);color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-1px}
.dayjump button small{display:block;font:500 12px/1.3 var(--mono);margin-top:2px}
.dayjump button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--tag)}
.dayjump button.skip{opacity:.4}
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:18px 16px 140px}
.slide .day{font:500 14px var(--mono);color:var(--muted)}
.slide h2{font-size:38px;margin:4px 0 12px}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--muted);margin-bottom:14px}
.stats b{color:var(--ink);font-weight:600}
.note{border-left:5px solid var(--tag);background:var(--surface);padding:10px 12px;margin-bottom:16px;font-size:16px}
.note strong{display:block;font-weight:600}
.slide h3{font-size:26px;margin:20px 0 8px}
.ing{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:center;width:100%;min-height:44px;padding:5px 0}
.ing .box{width:22px;height:22px}
.ing .box svg{width:13px;height:13px}
.ing + .ing{border-top:1px solid var(--line)}
[aria-checked="true"].ing span:last-child{color:var(--muted);text-decoration:line-through}
.step{display:grid;grid-template-columns:38px 1fr;gap:10px;width:100%;padding:13px 0;font-size:18px;line-height:1.42}
.step + .step{border-top:1px solid var(--line)}
.num{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 21px/1 var(--display)}
[aria-checked="true"].step .num{background:var(--ink);color:var(--bg)}
[aria-checked="true"].step .txt{color:var(--muted)}
.src{margin:16px 0 0;padding:10px 12px;background:var(--surface);border-left:5px solid var(--line);font-size:15px;color:var(--muted)}
.src a{color:var(--ink);font-weight:600}
.prot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.empty{color:var(--muted);margin:0}
.flip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.flip button{padding:15px 10px;text-align:center;border:1.5px solid var(--ink);border-radius:6px;font:700 21px/1 var(--display)}
.flip button[disabled]{visibility:hidden}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="app">
  <nav role="tablist">
    <button role="tab" id="tab-list" data-tab="list" aria-selected="true">Indkøb</button>
    <button role="tab" id="tab-rec" data-tab="rec" aria-selected="false">Opskrifter</button>
  </nav>
  <main>
    <section class="view" id="view-list" aria-label="Indkøbsliste"></section>
    <section class="view" id="view-rec" aria-label="Opskrifter">
      <div class="dayjump" id="dayjump"></div>
      <div class="pager" id="pager"></div>
    </section>
  </main>
</div>

<script>
/* Planer ligger i databasen (plans/<id>). BUILTIN_PLANS kan være tom. */
const BUILTIN_PLANS = [];

function pickPlan(plans, today){
  const hits = plans.filter(p => p && p.id && p.start <= today && today <= p.end && Array.isArray(p.days) && p.items);
  hits.sort((a,b) => a.start < b.start ? 1 : -1);
  return hits[0] || null;
}
function nextPlan(plans, today){
  return plans.filter(p => p && p.start > today).sort((a,b) => a.start < b.start ? -1 : 1)[0] || null;
}

function buildList(plan, off){
  const need = {}, pantry = {};
  for (const d of plan.days){
    if (off[d.id]) continue;
    for (const [, id, qty] of d.ing){
      if (!id) continue;
      if (id.startsWith("p:")) pantry[id.slice(2)] = true;
      else need[id] = (need[id] || 0) + qty;
    }
  }
  const lines = [];
  for (const [id, q] of Object.entries(need)){
    const it = plan.items[id];
    const packs = Math.ceil(q / it.q - 1e-9);
    lines.push({id, it, packs, cost: packs * it.pr});
  }
  const shop = lines.reduce((s, l) => s + l.cost, 0);
  const n = plan.days.filter(d => !off[d.id]).length;
  return {lines, pantry: Object.keys(pantry), shop, total: n ? shop + plan.pantryCost : 0, budget: Math.round((plan.weekBudget || 0) * n / 7), n};
}

if (typeof document !== "undefined") {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const linkify = t => esc(t).replace(/https?:\/\/[^\s<]+[^\s<.,)]/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\/(www\.)?/,"").split("/")[0]}</a>`);
  const money = v => Number.isInteger(v) ? String(v) : v.toFixed(2).replace(".", ",");
  const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5"/></svg>';
  const PLANS_KEY = "madplan:plans";
  const todayStr = () => new Date().toLocaleDateString("sv-SE");
  const keyOf = id => "madplan:" + id;
  let PLAN = null, allPlans = BUILTIN_PLANS.slice(), plansLoaded = false, loadFailed = false;
  let S = {checks:{}, off:{}};
  let db = null, docRef = null, unsubChecks = null, saveT = null, writing = false, rev = 0, savedRev = 0, lastLocal = 0, syncFail = false, synced = false, cur = 0, resetT = null;

  try { const raw = localStorage.getItem(PLANS_KEY); if (raw) mergePlans(JSON.parse(raw)); } catch(e){}

  function mergePlans(list){
    const map = {};
    BUILTIN_PLANS.concat(list || []).forEach(p => { if (p && p.id) map[p.id] = p; });
    allPlans = Object.values(map);
  }

  function loadChecks(id){
    S = {checks:{}, off:{}};
    try { const raw = localStorage.getItem(keyOf(id)); if (raw) { const p = JSON.parse(raw); S = {checks:{...(p.checks||{})}, off:{...(p.off||{})}}; } } catch(e){}
  }

  function persist(){
    try { localStorage.setItem(keyOf(PLAN.id), JSON.stringify(S)); } catch(e){}
    if (!docRef) return;
    rev++;
    lastLocal = Date.now();
    clearTimeout(saveT);
    saveT = setTimeout(flush, 400);
  }

  async function flush(){
    if (writing || !docRef) return;
    writing = true;
    try {
      while (savedRev < rev) {
        const r = rev;
        await docRef.set({checks:{...S.checks}, off:{...S.off}});
        savedRev = r;
        lastLocal = Date.now();
      }
      syncFail = false;
      setStatus(true);
    } catch(e){ savedRev = rev; syncFail = true; setStatus(false); }
    writing = false;
  }

  function setStatus(ok){
    synced = ok;
    const el = $("status");
    if (el) el.textContent = ok ? "Dine afkrydsninger følger med på alle dine enheder." : "Dine afkrydsninger gemmes på denne enhed.";
  }

  function renderEmpty(){
    const msg = plansLoaded || loadFailed
      ? (loadFailed ? "Madplanen kunne ikke hentes. Tjek din forbindelse, og åbn appen igen." : "Der er ingen madplan til denne uge endnu. Den næste bliver lagt ind fredag morgen.")
      : "Henter ugens madplan …";
    $("view-list").innerHTML = `<div class="head"><h1>Madplan</h1><p class="empty">${esc(msg)}</p></div>`;
    $("dayjump").innerHTML = "";
    $("pager").innerHTML = `<article class="slide"><p class="empty">${esc(msg)}</p></article>`;
  }

  function renderList(){
    const L = buildList(PLAN, S.off);
    const upcoming = nextPlan(allPlans, todayStr());
    let h = `<div class="head">
      <div class="head-top"><h1>${esc(PLAN.title)}</h1><div class="total" id="total">${Math.round(L.total)} kr.</div></div>
      <div class="sub"><span>${esc(PLAN.store)} · ${esc(PLAN.period)}</span><span>Budget ${L.budget} kr.</span></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="sub"><span id="count"></span><span>inkl. ${PLAN.pantryCost} kr. til skabet</span></div>
    </div>
    <div class="days">${PLAN.days.map(d=>`<button data-day="${d.id}" aria-pressed="${!S.off[d.id]}" aria-label="${esc(d.label)}">${d.short}</button>`).join("")}</div>
    ${upcoming?`<p class="hint"><b>Næste uges plan er klar</b> og vises fra søndag.</p>`:""}
    <p class="hint">Tryk på en vare for at sætte flueben, og tryk igen for at fjerne det. Tryk en dag fra, så retter listen og prisen sig selv.</p>`;
    for (const [g, title] of PLAN.groups){
      const rows = L.lines.filter(l => l.it.g === g);
      if (!rows.length) continue;
      h += `<div class="group"><h2>${esc(title)}</h2><span data-groupcount="${g}"></span></div><div class="rows" data-group="${g}">`;
      for (const l of rows){
        const size = l.packs > 1 ? `${l.packs} × ${l.it.p}` : l.it.p;
        h += `<button class="row" role="checkbox" aria-checked="false" data-k="i:${l.id}" data-shop="1">
          <span class="box">${CHECK}</span>
          <span><span class="name">${esc(l.it.n)}</span><span class="meta"><span>${esc(size)}</span>${l.it.tag?`<b>${esc(l.it.tag)}</b>`:""}</span></span>
          <span class="price${l.it.o?" deal":""}">${money(l.cost)}${l.it.o?"":" kr."}</span>
        </button>`;
      }
      h += `</div>`;
    }
    if (L.pantry.length){
      h += `<div class="group"><h2>Har du det derhjemme?</h2></div><div class="rows">`;
      for (const p of L.pantry){
        h += `<button class="row" role="checkbox" aria-checked="false" data-k="p:${p}"><span class="box">${CHECK}</span><span class="name">${esc(PLAN.pantry[p])}</span><span></span></button>`;
      }
      h += `</div>`;
    }
    h += `<div class="tools">
      <button class="btn" id="copy">Kopiér listen til Google Keep</button>
      <textarea id="copy-out" readonly aria-label="Indkøbsliste som tekst"></textarea>
      <button class="btn quiet" id="reset">Fjern alle flueben på listen</button>
    </div>
    <p class="foot"><span id="status"></span> Sæt listen ind i en Keep-note, og vælg Vis afkrydsningsfelter i menuen. Gule prisskilte er varer fra ugens avis.</p>`;
    $("view-list").innerHTML = h;
    setStatus(synced);
    paint();
  }

  function renderRecipes(){
    $("dayjump").innerHTML = PLAN.days.map((d,i)=>`<button data-go="${i}" aria-label="${esc(d.label)}">${d.short}<small>${d.date.slice(8).replace(/^0/,"")}/${d.date.slice(5,7)}</small></button>`).join("");
    $("pager").innerHTML = PLAN.days.map((d,i)=>{
      const prev = PLAN.days[i-1], next = PLAN.days[i+1];
      return `<article class="slide" id="slide-${d.id}">
        <div class="day">${esc(d.label)}</div>
        <h2>${esc(d.name)}</h2>
        <div class="stats"><span><b>${esc(d.time)}</b></span>${PLAN.people?`<span>${esc(PLAN.people)}</span>`:""}</div>
        ${d.note?`<div class="note"><strong>${esc(d.note.h)}</strong>${esc(d.note.t)}</div>`:""}
        <h3>Det skal du bruge</h3>
        ${d.ing.map((g,n)=>`<button class="ing" role="checkbox" aria-checked="false" data-k="r:${d.id}:i${n}"><span class="box">${CHECK}</span><span>${esc(g[0])}</span></button>`).join("")}
        <h3>Sådan gør du</h3>
        ${d.steps.filter(t=>!/^Kilde:/.test(t)).map((t,n)=>`<button class="step" role="checkbox" aria-checked="false" data-k="r:${d.id}:s${n}"><span class="num">${n+1}</span><span class="txt">${esc(t)}</span></button>`).join("")}
        ${d.steps.filter(t=>/^Kilde:/.test(t)).map(t=>`<p class="src">${linkify(t)}</p>`).join("")}
        <div class="prot">Protein: ${esc(d.adult)} pr. voksen, ${esc(d.child)} pr. barn</div>
        <div class="flip">
          <button data-go="${i-1}" ${prev?"":"disabled"}>← ${prev?prev.short:""}</button>
          <button data-go="${i+1}" ${next?"":"disabled"} style="text-align:center">${next?next.short:""} →</button>
        </div>
      </article>`;
    }).join("");
  }

  function paint(){
    document.querySelectorAll("[data-k]").forEach(el => el.setAttribute("aria-checked", S.checks[el.dataset.k] ? "true" : "false"));
    const shop = [...document.querySelectorAll('[data-shop]')];
    const done = shop.filter(e => S.checks[e.dataset.k]).length;
    if ($("count")) $("count").textContent = `${done} af ${shop.length} i kurven`;
    if ($("bar")) $("bar").style.width = shop.length ? (100*done/shop.length)+"%" : "0";
    if (!PLAN) return;
    PLAN.groups.forEach(([g])=>{
      const c = document.querySelector(`[data-groupcount="${g}"]`);
      if (!c) return;
      const rows = [...document.querySelectorAll(`[data-group="${g}"] [data-shop]`)];
      c.textContent = `${rows.filter(e=>S.checks[e.dataset.k]).length}/${rows.length}`;
    });
    document.querySelectorAll("#dayjump [data-go]").forEach((b,i)=>{
      b.setAttribute("aria-current", i===cur ? "true":"false");
      b.classList.toggle("skip", !!S.off[PLAN.days[i].id]);
    });
  }

  function goTo(i, smooth){
    i = Math.max(0, Math.min(PLAN.days.length-1, i));
    cur = i;
    const p = $("pager");
    p.scrollTo({left:i*p.clientWidth, behavior:smooth?"smooth":"auto"});
    paint();
  }

  function showTab(tab){
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
    $("view-"+tab).classList.add("on");
    document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab?"true":"false"));
    if (tab==="rec" && PLAN) goTo(cur,false);
    try { const want = tab==="rec"?"#opskrifter":"#indkob"; if (location.hash!==want) history.replaceState(null,"",want); } catch(e){}
  }

  document.addEventListener("click", async ev => {
    if (!PLAN) { const t0 = ev.target.closest("[data-tab]"); if (t0) showTab(t0.dataset.tab); return; }
    const k = ev.target.closest("[data-k]");
    if (k){ S.checks[k.dataset.k] = !S.checks[k.dataset.k]; persist(); paint(); return; }
    const tab = ev.target.closest("[data-tab]");
    if (tab){ showTab(tab.dataset.tab); return; }
    const go = ev.target.closest("[data-go]");
    if (go && !go.disabled){ goTo(+go.dataset.go,true); return; }
    const day = ev.target.closest("[data-day]");
    if (day){ const id=day.dataset.day; S.off[id] = !S.off[id]; persist(); const top=$("view-list").scrollTop; renderList(); $("view-list").scrollTop=top; return; }
    if (ev.target.closest("#reset")){
      const b=$("reset");
      if (!resetT){ b.textContent="Tryk igen for at fjerne alle flueben"; resetT=setTimeout(()=>{resetT=null; if($("reset")) $("reset").textContent="Fjern alle flueben på listen";},4000); return; }
      clearTimeout(resetT); resetT=null;
      Object.keys(S.checks).forEach(c=>{ if(c.startsWith("i:")||c.startsWith("p:")) S.checks[c]=false; });
      b.textContent="Fjern alle flueben på listen";
      persist(); paint(); return;
    }
    if (ev.target.closest("#copy")){
      const L=buildList(PLAN,S.off);
      const text=L.lines.filter(l=>!S.checks["i:"+l.id]).map(l=>`${l.it.n} (${l.packs>1?l.packs+" × ":""}${l.it.p})`).join("\n");
      const b=$("copy");
      try { await navigator.clipboard.writeText(text); b.textContent="Kopieret. Sæt den ind i Keep"; setTimeout(()=>{ if($("copy")) $("copy").textContent="Kopiér listen til Google Keep"; },2500); }
      catch(e){ const o=$("copy-out"); o.value=text; o.style.display="block"; o.focus(); o.select(); b.textContent="Markér og kopiér teksten herunder"; }
    }
  });

  let scrollT;
  function bindPager(){
    $("pager").addEventListener("scroll", () => {
      clearTimeout(scrollT);
      scrollT=setTimeout(()=>{ const p=$("pager"); if(!p.clientWidth) return; const i=Math.round(p.scrollLeft/p.clientWidth); if(i!==cur){cur=i;paint();} },80);
    },{passive:true});
    window.addEventListener("resize",()=>{ if(PLAN && $("view-rec").classList.contains("on")) goTo(cur,false); });
  }

  function applyPlan(){
    const today = todayStr();
    const next = pickPlan(allPlans, today);
    const same = next && PLAN && next.id === PLAN.id && JSON.stringify(next) === JSON.stringify(PLAN);
    if (same) { const top=$("view-list").scrollTop; renderList(); $("view-list").scrollTop=top; return; }
    const changedId = (next && next.id) !== (PLAN && PLAN.id);
    PLAN = next;
    if (!PLAN) { detachChecks(); renderEmpty(); return; }
    if (changedId) { loadChecks(PLAN.id); attachChecks(); }
    const idx = PLAN.days.findIndex(d => d.date === today);
    cur = idx >= 0 ? idx : 0;
    renderRecipes();
    renderList();
    if (!booted) { booted = true; showTab(location.hash === "#opskrifter" || idx > 0 ? "rec" : "list"); }
    else if ($("view-rec").classList.contains("on")) goTo(cur,false);
  }
  let booted = false;

  function detachChecks(){
    clearTimeout(saveT);
    if (unsubChecks) { try { unsubChecks(); } catch(e){} }
    unsubChecks = null; docRef = null; rev = 0; savedRev = 0; syncFail = false;
  }

  function attachChecks(){
    detachChecks();
    if (!db) return;
    const planId = PLAN.id;
    try {
      docRef = db.doc("checks/" + planId);
      unsubChecks = docRef.onSnapshot(snap => {
        if (!PLAN || PLAN.id !== planId) return;
        setStatus(!syncFail);
        if (syncFail || writing || savedRev < rev || Date.now() - lastLocal < 2000) return;
        const d = snap && snap.exists !== false && typeof snap.data === "function" ? snap.data() : null;
        if (!d || !d.checks) return;
        const sameOff = JSON.stringify(d.off||{}) === JSON.stringify(S.off);
        S = {checks:{...d.checks}, off:{...(d.off||{})}};
        try { localStorage.setItem(keyOf(planId), JSON.stringify(S)); } catch(e){}
        if (!sameOff){ const top=$("view-list").scrollTop; renderList(); $("view-list").scrollTop=top; } else paint();
      }, () => setStatus(false));
    } catch(e){ setStatus(false); }
  }

  async function connect(){
    const fail = () => { loadFailed = true; if (!PLAN) renderEmpty(); setStatus(false); };
    if (!window.claude || !window.claude.use) { fail(); return; }
    const limit = setTimeout(fail, 10000);
    try {
      db = await window.claude.use("db");
      if (!db) { clearTimeout(limit); fail(); return; }
      if (PLAN) attachChecks();
      db.collection("plans").onSnapshot(snap => {
        if (snap.empty && snap.metadata && snap.metadata.fromCache) return;
        clearTimeout(limit);
        plansLoaded = true; loadFailed = false;
        const list = snap.docs.map(d => JSON.parse(JSON.stringify(d.data())));
        mergePlans(list);
        try { localStorage.setItem(PLANS_KEY, JSON.stringify(list)); } catch(e){}
        applyPlan();
      }, () => { clearTimeout(limit); fail(); });
    } catch(e){ clearTimeout(limit); fail(); }
  }

  renderEmpty();
  bindPager();
  applyPlan();
  if (!PLAN) showTab("list");
  document.addEventListener("visibilitychange", () => { if (!document.hidden) applyPlan(); });
  connect();
}
if (typeof module !== "undefined") module.exports = {BUILTIN_PLANS, buildList, pickPlan, nextPlan};
</script>
